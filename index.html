<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/scholr-logo-final.png?v=4" />
    <link rel="apple-touch-icon" href="/scholr-logo-final.png?v=4" />
    <!-- user-scalable=no is a deliberate product decision, not an oversight: the
         app is meant to behave like an app, not a page you can drag and pinch.
         It costs pinch-to-zoom as a magnification aid — the in-app type scale
         and the OS-level Display Zoom / Larger Text settings are the remaining
         paths. Revert by deleting maximum-scale and user-scalable here and
         removing the gesture handler in src/main.jsx. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- One theme-color meant the status bar and browser chrome stayed near-black
         in the light theme, against a #FBFBFA page. One per scheme; the value
         is the colour at the very top of the page, not the brand colour. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFBFA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070709" />

    <!-- iOS only delivers web push to a site installed to the home screen, and
         it will only offer "Add to Home Screen" as an app for a site with a
         manifest marked display:standalone. Without this, push silently works
         on desktop and never on iPhone — which is most of the audience. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="scholr" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>scholr — Study smarter. Study together.</title>
    <meta
      name="description"
      content="Shared notebooks, flashcards, and an AI tutor you use with your friends. See who's studying what, and jump in."
    />

    <!-- Invite links get shared in iMessage and Discord; without these they unfurl blank. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="scholr" />
    <meta property="og:url" content="https://scholr.dev/" />
    <meta property="og:title" content="scholr — Study smarter. Study together." />
    <meta
      property="og:description"
      content="Shared notebooks, flashcards, and an AI tutor you use with your friends. See who's studying what, and jump in."
    />
    <meta property="og:image" content="https://scholr.dev/scholr-logo-final.png?v=4" />
    <meta property="og:image:width" content="256" />
    <meta property="og:image:height" content="256" />
    <meta property="og:image:alt" content="The scholr mark: a speech bubble with a sparkle inside." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="scholr — Study smarter. Study together." />
    <meta
      name="twitter:description"
      content="Shared notebooks, flashcards, and an AI tutor you use with your friends. See who's studying what, and jump in."
    />
    <meta name="twitter:image" content="https://scholr.dev/scholr-logo-final.png?v=4" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
